<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Router restart versus factory reset</title><desc id="desc">A restart cycles power and usually keeps configuration. A factory reset erases settings and should be the last resort after model-specific instructions and ISP details are confirmed.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5f8ff"/><stop offset="1" stop-color="#fff3ea"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#243a60" flood-opacity=".12"/></filter></defs>
<rect width="1200" height="600" rx="30" fill="url(#bg)"/>
<text x="60" y="75" fill="#172944" font-family="Inter,Arial,sans-serif" font-size="38" font-weight="800">Restart or factory reset?</text><text x="60" y="116" fill="#5a6c86" font-family="Inter,Arial,sans-serif" font-size="20">They are not the same action. Choose the least destructive step first.</text>
<g filter="url(#shadow)"><rect x="60" y="160" width="510" height="320" rx="24" fill="#fff"/><rect x="630" y="160" width="510" height="320" rx="24" fill="#fff"/></g>
<g font-family="Inter,Arial,sans-serif">
<rect x="92" y="190" width="446" height="62" rx="16" fill="#e2f7ee"/><text x="118" y="229" fill="#147455" font-size="25" font-weight="800">RESTART / REBOOT</text>
<circle cx="127" cy="292" r="14" fill="#16a275"/><path d="M120 291 a8 8 0 1 1 2 7 M120 284 v8 h8" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="157" y="298" fill="#20324f" font-size="18" font-weight="700">Power-cycle the device</text><text x="118" y="335" fill="#566780" font-size="17">• Usually keeps saved network settings</text><text x="118" y="367" fill="#566780" font-size="17">• Can help with temporary connection issues</text><text x="118" y="399" fill="#566780" font-size="17">• Wait for the router to reconnect fully</text><text x="118" y="447" fill="#147455" font-size="16" font-weight="800">Try this first for many simple issues</text>
<rect x="662" y="190" width="446" height="62" rx="16" fill="#fff0ec"/><text x="688" y="229" fill="#b63e31" font-size="25" font-weight="800">FACTORY RESET</text>
<circle cx="697" cy="292" r="14" fill="#dc5146"/><path d="M690 285 l14 14 M704 285 l-14 14" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
<text x="727" y="298" fill="#20324f" font-size="18" font-weight="700">Returns settings to defaults</text><text x="688" y="335" fill="#566780" font-size="17">• May erase Wi-Fi name/password and admin setup</text><text x="688" y="367" fill="#566780" font-size="17">• May erase ISP, WAN, VLAN and custom rules</text><text x="688" y="399" fill="#566780" font-size="17">• You may need the ISP to reconnect service</text><text x="688" y="447" fill="#b63e31" font-size="16" font-weight="800">Use only as a last resort</text>
</g>
<rect x="60" y="508" width="1080" height="58" rx="16" fill="#182d4f"/><text x="84" y="544" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700">Before a factory reset: confirm the exact model manual, ISP credentials/configuration, backup and recovery plan.</text>
</svg>
