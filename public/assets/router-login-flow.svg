<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Safe router login flow</title><desc id="desc">Connect to your own router, find its actual gateway, open the local address in the browser, use model-specific credentials, and troubleshoot before resetting.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f203b"/><stop offset="1" stop-color="#193966"/></linearGradient><linearGradient id="acc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs>
<rect width="1200" height="600" rx="30" fill="url(#bg)"/><circle cx="1100" cy="45" r="155" fill="#2c5791" opacity=".35"/><circle cx="70" cy="560" r="120" fill="#4e4ba2" opacity=".24"/>
<text x="60" y="76" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="37" font-weight="800">Router login: the safe sequence</text>
<text x="60" y="115" fill="#cbdaf3" font-family="Inter,Arial,sans-serif" font-size="20">Follow the steps in order. Do not guess passwords or reset too early.</text>
<g font-family="Inter,Arial,sans-serif">
  <g><rect x="60" y="170" width="205" height="245" rx="20" fill="#fff"/><circle cx="96" cy="208" r="21" fill="url(#acc)"/><text x="96" y="215" fill="#102440" font-size="18" font-weight="800" text-anchor="middle">1</text><text x="82" y="259" fill="#142849" font-size="20" font-weight="800">Connect</text><text x="82" y="293" fill="#556985" font-size="16">Use the router’s</text><text x="82" y="317" fill="#556985" font-size="16">own Wi-Fi or</text><text x="82" y="341" fill="#556985" font-size="16">Ethernet network.</text><text x="82" y="382" fill="#2869d6" font-size="14" font-weight="700">Same network</text></g>
  <g><rect x="292" y="170" width="205" height="245" rx="20" fill="#fff"/><circle cx="328" cy="208" r="21" fill="url(#acc)"/><text x="328" y="215" fill="#102440" font-size="18" font-weight="800" text-anchor="middle">2</text><text x="314" y="259" fill="#142849" font-size="20" font-weight="800">Find IP</text><text x="314" y="293" fill="#556985" font-size="16">Read the device’s</text><text x="314" y="317" fill="#556985" font-size="16">Default Gateway.</text><text x="314" y="341" fill="#556985" font-size="16">Do not assume it.</text><text x="314" y="382" fill="#2869d6" font-size="14" font-weight="700">Actual gateway</text></g>
  <g><rect x="524" y="170" width="205" height="245" rx="20" fill="#fff"/><circle cx="560" cy="208" r="21" fill="url(#acc)"/><text x="560" y="215" fill="#102440" font-size="18" font-weight="800" text-anchor="middle">3</text><text x="546" y="259" fill="#142849" font-size="20" font-weight="800">Open local page</text><text x="546" y="293" fill="#556985" font-size="16">Type the address</text><text x="546" y="317" fill="#556985" font-size="16">in the browser bar,</text><text x="546" y="341" fill="#556985" font-size="16">not a search engine.</text><text x="546" y="382" fill="#2869d6" font-size="14" font-weight="700">Local network only</text></g>
  <g><rect x="756" y="170" width="205" height="245" rx="20" fill="#fff"/><circle cx="792" cy="208" r="21" fill="url(#acc)"/><text x="792" y="215" fill="#102440" font-size="18" font-weight="800" text-anchor="middle">4</text><text x="778" y="259" fill="#142849" font-size="20" font-weight="800">Use credentials</text><text x="778" y="293" fill="#556985" font-size="16">Check device label,</text><text x="778" y="317" fill="#556985" font-size="16">official manual or</text><text x="778" y="341" fill="#556985" font-size="16">ISP setup record.</text><text x="778" y="382" fill="#2869d6" font-size="14" font-weight="700">No universal password</text></g>
  <g><rect x="988" y="170" width="152" height="245" rx="20" fill="#fff"/><circle cx="1024" cy="208" r="21" fill="url(#acc)"/><text x="1024" y="215" fill="#102440" font-size="18" font-weight="800" text-anchor="middle">5</text><text x="1010" y="259" fill="#142849" font-size="19" font-weight="800">Troubleshoot</text><text x="1010" y="293" fill="#556985" font-size="15">Check gateway,</text><text x="1010" y="316" fill="#556985" font-size="15">network, browser</text><text x="1010" y="339" fill="#556985" font-size="15">and ISP first.</text><text x="1010" y="382" fill="#2869d6" font-size="14" font-weight="700">Reset last</text></g>
</g>
<g fill="none" stroke="#93b9f8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M267 292 h20 m-7 -7 7 7 -7 7"/><path d="M499 292 h20 m-7 -7 7 7 -7 7"/><path d="M731 292 h20 m-7 -7 7 7 -7 7"/><path d="M963 292 h20 m-7 -7 7 7 -7 7"/></g>
<rect x="60" y="455" width="1080" height="88" rx="18" fill="#122a4c" stroke="#385d90"/><text x="86" y="490" fill="#93c5fd" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="800">IMPORTANT</text><text x="86" y="519" fill="#e5eefc" font-family="Inter,Arial,sans-serif" font-size="17">Router Portal does not collect admin passwords or Wi-Fi keys. A factory reset can erase your network and ISP settings.</text>
</svg>
